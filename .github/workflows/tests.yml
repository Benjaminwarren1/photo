name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out for now: its hosted runners were never picked up within GitHub's
        # 15 minute limit, which marked every run as failed. Add it back when the Mac version is worked on.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -c "from photolifeboat import jpeg; assert jpeg.HAVE_C, 'C decoder was not built'"
      - run: python -m pytest -q
