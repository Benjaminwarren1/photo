[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photorecover"
dynamic = ["version"]
description = "Free tool that rescues deleted photos from memory cards, rebuilding fragmented ones instead of leaving grey boxes."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Shows the wizard in a window of its own instead of the browser (the Windows build always includes it).
window = ["pywebview>=5"]

[project.scripts]
photorecover = "photorecover.cli:main"

[tool.setuptools.dynamic]
version = { attr = "photorecover.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
