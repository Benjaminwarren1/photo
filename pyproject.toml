[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photolifeboat"
dynamic = ["version"]
description = "Free tool that rescues deleted photos from memory cards, rebuilding fragmented ones instead of leaving grey boxes."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
# jeepney: Linux only, to ask UDisks for read access to a card without root (pure Python, small).
dependencies = ["numpy>=1.24", "Pillow>=10", "jeepney>=0.7; sys_platform == 'linux'"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Shows the wizard in a window of its own instead of the browser (the Windows build always includes it).
window = ["pywebview>=5"]

[project.scripts]
photolifeboat = "photolifeboat.cli:main"

[tool.setuptools.dynamic]
version = { attr = "photolifeboat.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
